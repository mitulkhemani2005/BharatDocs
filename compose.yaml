services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BHARATDOCS_DOCUMENTS: /data/BharatDocs
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - bharatdocs_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  bharatdocs_data:
